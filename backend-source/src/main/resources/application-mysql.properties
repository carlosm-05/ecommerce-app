# Perfil MySQL: ./mvnw spring-boot:run -Dspring-boot.run.profiles=mysql
# Crea antes la base de datos:  CREATE DATABASE ecommerce;
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ecommerce?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.h2.console.enabled=false
