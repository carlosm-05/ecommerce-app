spring.application.name=ecommerce-api
server.port=${PORT:8080}

# Lee variables desde el archivo .env de la carpeta del proyecto (si existe).
# Ahi van las credenciales reales (Supabase, SMTP...). El .env NO se sube a git.
spring.config.import=optional:file:.env[.properties]

# ---------------------------------------------------------------- Base de datos
# Si DB_URL esta definida (ej. en .env) se usa esa base (PostgreSQL/Supabase, MySQL...).
# Si no, H2 en archivo (no hay que instalar nada). Los datos quedan en ./data
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/ecommerce;AUTO_SERVER=TRUE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
# Pocas conexiones: el pooler de Supabase (plan gratis) tiene un limite bajo.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Consola web de H2: http://localhost:8080/h2-console  (JDBC URL: jdbc:h2:file:./data/ecommerce)
spring.h2.console.enabled=${H2_CONSOLE:true}
spring.h2.console.path=/h2-console

# ---------------------------------------------------------------- JWT
# Cambia este secreto en produccion (minimo 32 caracteres). Se puede pasar por variable de entorno.
app.jwt.secret=${JWT_SECRET:cambia-este-secreto-por-uno-largo-y-aleatorio-123456}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:1440}

# ---------------------------------------------------------------- Carrito
# IVA Colombia 19 %. Envio fijo, gratis si el subtotal supera el umbral.
app.cart.tax-rate=0.19
app.cart.shipping-cost=12000
app.cart.free-shipping-from=200000

# ---------------------------------------------------------------- Recuperacion de contrasena
# Enlace que llega en el correo; se le agrega el token al final.
# Opcion A (por defecto): pagina web servida por este mismo backend.
# Opcion B: deep link a la app Flutter, ej: ecommerceapp://reset-password?token=
app.reset-password.base-url=${RESET_PASSWORD_URL:http://localhost:8080/reset-password.html?token=}
app.reset-password.expiration-minutes=30

# ---------------------------------------------------------------- Correo (SMTP)
# Si spring.mail.host queda vacio, el enlace de recuperacion se imprime en la consola.
# Ejemplo con Mailtrap (sandbox): host sandbox.smtp.mailtrap.io, puerto 2525
# Ejemplo con Gmail: host smtp.gmail.com, puerto 587 y una "contrasena de aplicacion"
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:2525}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
app.mail.from=${MAIL_FROM:no-reply@ecommerce.test}

# ---------------------------------------------------------------- Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
