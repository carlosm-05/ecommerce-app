<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Restablecer contraseña</title>
  <style>
    :root { --primary:#4f46e5; --error:#dc2626; --ok:#16a34a; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
           font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; background:#f3f4f6; padding:16px; }
    .card { background:#fff; width:100%; max-width:400px; padding:28px; border-radius:16px; box-shadow:0 10px 30px rgba(0,0,0,.08); }
    h1 { font-size:22px; margin:0 0 6px; }
    p.sub { color:#6b7280; margin:0 0 20px; font-size:14px; }
    label { display:block; font-size:14px; font-weight:600; margin:14px 0 6px; }
    .field { position:relative; }
    input { width:100%; padding:12px 44px 12px 12px; border:1px solid #d1d5db; border-radius:10px; font-size:15px; }
    input:focus { outline:2px solid var(--primary); border-color:transparent; }
    .toggle { position:absolute; right:8px; top:50%; transform:translateY(-50%); background:none; border:0; cursor:pointer; font-size:13px; color:var(--primary); }
    .err { color:var(--error); font-size:13px; min-height:18px; margin-top:4px; }
    button[type=submit] { width:100%; margin-top:18px; padding:13px; border:0; border-radius:10px; background:var(--primary); color:#fff; font-size:16px; font-weight:600; cursor:pointer; }
    button[disabled] { opacity:.6; cursor:default; }
    .msg { margin-top:16px; font-size:14px; text-align:center; }
    .msg.ok { color:var(--ok); } .msg.bad { color:var(--error); }
  </style>
</head>
<body>
<div class="card">
  <h1>Restablecer contraseña</h1>
  <p class="sub">Escribe tu nueva contraseña (mínimo 8 caracteres).</p>
  <form id="form" novalidate>
    <label for="newPassword">Nueva contraseña</label>
    <div class="field">
      <input id="newPassword" type="password" autocomplete="new-password">
      <button type="button" class="toggle" data-for="newPassword">Mostrar</button>
    </div>
    <div class="err" id="err-newPassword"></div>

    <label for="confirmPassword">Confirmar contraseña</label>
    <div class="field">
      <input id="confirmPassword" type="password" autocomplete="new-password">
      <button type="button" class="toggle" data-for="confirmPassword">Mostrar</button>
    </div>
    <div class="err" id="err-confirmPassword"></div>

    <button type="submit" id="submit">Guardar contraseña</button>
    <div class="msg" id="msg"></div>
  </form>
</div>
<script>
  const token = new URLSearchParams(location.search).get('token');
  const msg = document.getElementById('msg');
  const submit = document.getElementById('submit');

  if (!token) {
    msg.textContent = 'El enlace no es válido.'; msg.className = 'msg bad'; submit.disabled = true;
  }

  document.querySelectorAll('.toggle').forEach(b => b.addEventListener('click', () => {
    const input = document.getElementById(b.dataset.for);
    const show = input.type === 'password';
    input.type = show ? 'text' : 'password';
    b.textContent = show ? 'Ocultar' : 'Mostrar';
  }));

  function setErr(field, text) { document.getElementById('err-' + field).textContent = text || ''; }

  document.getElementById('form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const newPassword = document.getElementById('newPassword').value;
    const confirmPassword = document.getElementById('confirmPassword').value;
    setErr('newPassword'); setErr('confirmPassword'); msg.textContent = '';

    let ok = true;
    if (newPassword.length < 8) { setErr('newPassword', 'Mínimo 8 caracteres'); ok = false; }
    if (newPassword !== confirmPassword) { setErr('confirmPassword', 'Las contraseñas no coinciden'); ok = false; }
    if (!ok) return;

    submit.disabled = true;
    try {
      const res = await fetch('/auth/reset-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token, newPassword, confirmPassword })
      });
      const data = await res.json();
      if (res.ok) {
        msg.textContent = data.message + '. Vuelve a la app para iniciar sesión.';
        msg.className = 'msg ok';
        document.getElementById('form').querySelectorAll('input').forEach(i => i.disabled = true);
        return;
      }
      Object.entries(data.fieldErrors || {}).forEach(([f, t]) => setErr(f, t));
      msg.textContent = data.message || 'No se pudo cambiar la contraseña';
      msg.className = 'msg bad';
    } catch (err) {
      msg.textContent = 'Error de conexión con el servidor'; msg.className = 'msg bad';
    }
    submit.disabled = false;
  });
</script>
</body>
</html>
